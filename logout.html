<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الخروج - Sugar Hero</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        .logout-box {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
            margin: auto;
        }
        .lock-icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0fdf4;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin: 0 auto 20px;
            border: 2px solid #bbf7d0;
        }
        .btn-portal-redirect {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.05rem;
            margin-top: 25px;
            transition: 0.2s;
        }
        .btn-portal-redirect:hover {
            background: var(--primary-hover);
        }
        .quick-links-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        .quick-links-row a {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
        }
        .quick-links-row a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh;">

    <div class="logout-box">
        <div class="lock-icon-circle">🔒</div>
        <h1 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 8px; color:#0f172a;">
            تم تسجيل الخروج بأمان
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px;">
            تم إنهاء جلستك وحماية سجلاتك الصحية وتفريغ مفاتيح الدخول وفق معايير الأمان الطبي HIPAA.
        </p>

        <a href="index.html" class="btn-portal-redirect">
            العودة للشاشة الترحيبية الرئيسية 🏠
        </a>

        <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <span style="font-size: 0.82rem; color: var(--text-muted);">أو ادخل مباشرة عبر بوابتك:</span>
            <div class="quick-links-row">
                <a href="doctor-login.html">بوابة الطبيب</a> •
                <a href="guardian-login.html">بوابة الأسرة</a> •
                <a href="admin-login.html">بوابة الإدارة</a>
            </div>
        </div>
    </div>

    <!-- تفريغ الجلسة فعلياً عند فتح الصفحة -->
    <script>
        sessionStorage.clear();
    </script>
</body>
</html>
