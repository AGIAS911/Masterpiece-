<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بدء حساب طبيب - Sugar Hero</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-bar">
        <a href="#" class="lang-switch"><span>🌐</span> اختر اللغة</a>
        <a href="doctor-login.html" class="back-circle-btn" title="رجوع">➔</a>
    </header>

    <main class="main-container">
        <div class="auth-card">
            <h2 class="view-heading">طلب اعتماد حساب طبي جديد</h2>

            <form class="form-wrapper" onsubmit="event.preventDefault(); window.location.href='doctor-dashboard.html';">
                <div class="form-group">
                    <label>الاسم الكامل واللقب المهني</label>
                    <input type="text" placeholder="د. أحمد الصالح" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني المهني</label>
                    <input type="email" placeholder="doctor@clinic.com" required>
                </div>
                <div class="form-group">
                    <label>التخصص الدقيق</label>
                    <select required>
                        <option value="">اختر التخصص...</option>
                        <option>غدد صماء وسكري</option>
                        <option>سكري أطفال وتغذية</option>
                        <option>باطنية عامة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم رخصة مزاولة المهنة</label>
                    <input type="text" placeholder="مثال: MED-99321" required>
                </div>
                <div class="form-group">
                    <label>تعيين كلمة المرور</label>
                    <input type="password" id="doc-reg-pass" placeholder="أدخل كلمة المرور" required>
                    <span class="password-toggle" onclick="togglePassword('doc-reg-pass')">👁️</span>
                </div>

                <button type="submit" class="bottom-action-btn">تأكيد طلب الاعتماد الطبي</button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
