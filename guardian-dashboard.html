<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العائلة - Sugar Hero</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        .profiles-row {
            display: flex;
            gap: 22px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 35px;
        }
        .profile-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 18px;
            padding: 24px 20px;
            width: 180px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .profile-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.12);
        }
        .badge-self {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #7c3aed;
            color: white;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 800;
        }
        .profile-avatar {
            font-size: 3.8rem;
            margin-bottom: 12px;
            line-height: 1;
        }
    </style>
</head>
<body style="background-color: #f8fafc;">

    <header class="top-bar" style="background: white; border-bottom: 1px solid var(--border-color);">
        <div style="font-weight: 800; color: var(--primary); font-size: 1.3rem;">👨‍👩‍👦 Sugar Hero | الأسرة</div>
        <a href="logout.html" class="btn-logout">تسجيل خروج</a>
    </header>

    <main class="dashboard-wrapper" style="text-align: center; padding-top: 30px;">
        <h1 style="font-size: 2rem; font-weight: 900; color: #0f172a; margin-bottom: 8px;">
            من تود متابعة حالته الصحية اليوم؟
        </h1>
        <p style="color: var(--text-muted); font-size: 1rem;">
            جميع أفراد العائلة مربوطون برقم الطوارئ المعتمد
        </p>

        <!-- الحاوية الأساسية لرسم بطاقات أفراد الأسرة -->
        <div class="profiles-row" id="profilesContainer">
            <p style="color: var(--text-muted); margin-top: 30px;">جاري تحميل ملفات العائلة...</p>
        </div>
    </main>

    <!-- استدعاء السكربتات بالترتيب الصحيح -->
    <script src="mockData.js"></script>
    <script src="app.js"></script>
    <script>
        function renderFamilyProfiles() {
            const container = document.getElementById('profilesContainer');
            if (!container) return;

            // التأكد من تهيئة الداتابيس
            if (typeof SugarHeroDB === 'undefined' || !SugarHeroDB.data) {
                container.innerHTML = '<p style="color:red;">تعذر الاتصال بقاعدة البيانات المحلية. تأكد من وجود ملف mockData.js</p>';
                return;
            }

            // فحص البيانات: إذا كانت الذاكرة فارغة، يتم عمل Reset تلقائي للـ Seed
            let profiles = SugarHeroDB.getGuardianProfiles(10);
            if (!profiles || profiles.length === 0) {
                SugarHeroDB.resetToDefault();
                profiles = SugarHeroDB.getGuardianProfiles(10);
            }

            container.innerHTML = '';

            // 1. رسم بطاقات أفراد العائلة
            profiles.forEach(p => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.onclick = () => {
                    SugarHeroDB.setActivePatientById(p.id);
                    window.location.href = 'patient-dashboard.html';
                };

                card.innerHTML = `
                    ${p.isSelfGuardian ? '<span class="badge-self">أنا (مريض)</span>' : ''}
                    <div class="profile-avatar">${p.avatar || '🧒🏽'}</div>
                    <h3 style="margin-bottom: 4px; font-size: 1.15rem;">${p.name}</h3>
                    <span style="color: var(--text-muted); font-size: 0.82rem; font-weight: 700;">${p.diabetesType}</span>
                `;
                container.appendChild(card);
            });

            // 2. إضافة بطاقة "إضافة فرد جديد"
            const addCard = document.createElement('div');
            addCard.className = 'profile-card';
            addCard.style.borderStyle = 'dashed';
            addCard.style.background = 'rgba(255,255,255,0.6)';
            addCard.onclick = handleAddNewMember;
            addCard.innerHTML = `
                <div class="profile-avatar" style="color: var(--text-muted);">➕</div>
                <h3 style="margin-bottom: 4px; color: var(--primary); font-size: 1.15rem;">إضافة فرد</h3>
                <span style="color: var(--text-muted); font-size: 0.82rem;">توليد كود دخول</span>
            `;
            container.appendChild(addCard);
        }

        function handleAddNewMember() {
            const name = prompt("أدخل اسم التابع الجديد (الطفل أو المسن):");
            if (!name || name.trim() === '') return;

            const isKid = confirm("هل التابع طفل؟\nاضغط (موافق) للطفل، أو (إلغاء) لكبير السن");
            const type = isKid ? 'kid' : 'elderly';
            const diabetesType = prompt("نوع السكري (مثال: Type 1 أو Type 2):", isKid ? "Type 1" : "Type 2");

            const res = SugarHeroDB.addDependentPatient(10, { name: name.trim(), type, diabetesType });
            if (res.success) {
                alert(`✅ تم إنشاء ملف ${name} بنجاح!\nرمز الدخول السريع هو: [ ${res.code} ]`);
                renderFamilyProfiles();
            } else {
                alert(res.message);
            }
        }

        document.addEventListener('DOMContentLoaded', renderFamilyProfiles);
    </script>
</body>
</html>
